<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Foto</title>

    <style>
        .container {
           width: 800px;
           margin: 30px;
           padding: 5px;
           display: flex;
           justify-content: center;
        }

        .container div {
            width: 100px;
            height: 100px;
            margin: 2px;
        }

        body{
            margin-bottom: 2em;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }

        .gallery img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="gallery">
    <header>
        <h2>Galeri Foto</h2>
        <img src="Miku.jpg">
        <img src="Miku.jpg">
        <img src="Kairi.jpg">
        <img src="Kairi.jpg">
    </header>
    </div>

</body>
</html>
