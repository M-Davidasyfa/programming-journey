<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        div.gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        div.gallery-item {
            margin: 5px;
            border: 1px solid #ccc;
            width: 180px;
        }

        div.gallery-item:hover {
            border: 1px solid #777;
        }

        div.gallery-item img {
            width: 100%;
            height: auto;
        }

        div.gallery-item div.desc {
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Image Gallery</h2>

<div class="gallery">

    <div class="gallery-item">
        <a target="_blank" href="img_5terre.jpg">
            <img src="Rias.jpg" alt="Cinque Terre" width="600" height="400">
        </a>
        <div class="desc">Waifu 1</div>
    </div>

    <div class="gallery-item">
        <a target="_blank" href="img_forest.jpg">
            <img src="Nakano Miku.webp" alt="Forest" width="600" height="400">
        </a>
        <div class="desc">Waifu 2</div>
    </div>

    <div class="gallery-item">
        <a target="_blank" href="img_lights.jpg">
            <img src="Chainsaw man pfp.webp" alt="Northern Lights" width="600" height="400">
        </a>
        <div class="desc">Waifu 3</div>
    </div>

    <div class="gallery-item">
        <a target="_blank" href="img_mountains.jpg">
            <img src="Sion.jpg" alt="Mountains" width="600" height="400">
        </a>
        <div class="desc">Waifu 4</div>
    </div>

</div>

</body>
</html>
