<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>TokoKu</h1>
    <p>Belanja Mudah</p>
</header>

<nav>
    <a href="#" onclick="tampilHome()">Home</a>
    <a href="#" onclick="tampilProduk()">Produk</a>
</nav>

<!-- HOME -->
<div id="home">
    <h2>Selamat Datang di TokoKu</h2>
    <p>Klik menu Produk untuk melihat barang</p>
</div>

<!-- PRODUK -->
<div id="produkSection" style="display: none;">

    <h2>Produk</h2>

    <div class="container-produk">

        <div class="produk">
            <img src="Offer msi Titan AI Gaming Laptop 18_ 120Hz Mini LED 4K Display.jpg">
            <h3>MSI Titan</h3>
            <p>Rp 110.000.000</p>
            <button>Lihat</button>
        </div>

        <div class="produk">
            <img src="ASUS ROG Strix SCAR 18 Ad _ RTX 5090 _ Ultimate Power for Elite Gamers.jpg">
            <h3>ROG Strix Scar</h3>
            <p>Rp 76.000.000</p>
            <button>Lihat</button>
        </div>

        <div class="produk">
            <img src="HP Omen MAX 16 – RTX 5080 Gaming Beast with Ryzen AI 9 (2026).jpg">
            <h3>HP Omen MAX 16</h3>
            <p>Rp 36.500.000</p>
            <button>Lihat</button>
        </div>

        <div class="produk">
            <img src="Laptop Gaming !Legion 5 Pro 16 Intel Ultra 7 255HX RTX5060-8GB 16_0 WQxga Oled 165HZ RGB.jpg">
            <h3>Legion 5 Pro</h3>
            <p>Rp 33.000.000</p>
            <button>Lihat</button>
        </div>

        <div class="produk">
            <img src="predator">
            <h3>Acer Predator</h3>
            <p>Rp 45.000.000</p>
            <button>Lihat</button>
        </div>

    </div>

</div>

<footer>
    <p>&copy; 2026 TokoKu</p>
</footer>

<script>
// Navigasi
function tampilHome() {
    document.getElementById("home").style.display = "block";
    document.getElementById("produkSection").style.display = "none";
}

function tampilProduk() {
    document.getElementById("home").style.display = "none";
    document.getElementById("produkSection").style.display = "block";
}
</script>

</body>
</html>
