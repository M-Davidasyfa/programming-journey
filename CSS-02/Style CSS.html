/* Selector Universal */
* {
    font-family: Arial, sans-serif;
}

/* Selector Tag */
p {
    color: blue;
    font-size: 18px;
}

/* Selector Class */
.highlight {
    background-color: yellow;
    padding: 5px;
}

/* Selector ID */
#box {
    background-color: red;
    color: white;
    padding: 10px;
    margin-top: 10px;
}
