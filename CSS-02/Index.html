<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector CSS Eksternal</title>

    <!-- Menghubungkan CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Contoh Selector CSS Eksternal</h1>

    <!-- Selector Tag -->
    <p>Ini adalah paragraf menggunakan selector tag.</p>

    <!-- Selector Class -->
    <p class="highlight">Ini paragraf dengan class highlight.</p>

    <!-- Selector ID -->
    <div id="box">
        Ini adalah div dengan ID "box".
    </div>

</body>
</html>
