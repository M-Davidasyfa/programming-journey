<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas Width Height 2</title>
    <style>
        .container {
            width: 500px;
            height: 300px;
            background-color: lightblue;
            position: relative;
        }

        .box-kecil {
            width: 200px;
            height: 150px;
            background-color: lightcoral;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box-kecil"></div>
    </div>

</body>
</html>
