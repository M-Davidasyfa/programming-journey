<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas Width Height</title>
    <style>
        .box1 {
            width: 200px;
            height: 100px;
            background-color: red;
            margin: 10px;
        }

        .box2 {
            width: 300px;
            height: 150px;
            background-color: blue;
            margin: 10px;
        }

        .box3 {
            width: 400px;
            height: 200px;
            background-color: green;
            margin: 10px;
        }
    </style>
</head>
<body>

    <div class="box1">Kotak 1</div>
    <div class="box2">Kotak 2</div>
    <div class="box3">Kotak 3</div>

</body>
</html>
