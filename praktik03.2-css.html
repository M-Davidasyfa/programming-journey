<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-transform: uppercase; /* diubah dari capitalize */
            color: darkgreen;
        }

        .upper {
            text-transform: uppercase;
            color: blue;
        }

        .lower {
            text-transform: lowercase;
            color: red;
        }

        .capital {
            text-transform: capitalize;
            color: purple;
        }
    </style>
</head>
<body>

    <h1>latihan text transform</h1>

    <p>
        <span class="upper">ini teks menjadi huruf besar semua</span><br>
        <span class="lower">INI TEKS MENJADI HURUF KECIL SEMUA</span><br>
        <span class="capital">ini teks setiap awal katanya menjadi besar</span>
    </p>

</body>
</html>
