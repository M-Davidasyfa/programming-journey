<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabungan Antara Rowspan dan collapse</title>
</head>
<body>
    <table border="1" style="border-collapse: collapse;">
        <tbody>
            <tr>
                <th colspan="2">Nama</th>
                <th rowspan="2">Asal</th>
            </tr>
            <tr>
                <th>Depan</th>
                <th>Belakang</th>
            </tr>
            <tr>
                <td>Budi</td>
                <td>Prakarya</td>
                <td>Makasar</td>
            </tr>
            <tr>
                <td>Andi</td>
                <td>Susilo</td>
                <td>Semarang</td>
            </tr>
            <tr>
                <td>Doni</td>
                <td>Sutrisno</td>
                <td>Jogja</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
