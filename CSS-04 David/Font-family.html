        .font-arial {
            font-family: Arial, Helvetica, sans-serif;
        }
        .fony-tims  {
            font-family: "Tims New Roman" Times, serif;
        }
        .font-courier   {
            font-family: "Courier New", Courier, monospace;
        }
    </style>
</head>
<body>
    <p class="font-arial">This is Arial font text.</p>
    <p class="font-times">This is Times Nwe Roman font text.</p>

</body>
</html>
